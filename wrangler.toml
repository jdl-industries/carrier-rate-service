name = "carrier-rate-service"
main = "src/index.ts"
compatibility_date = "2024-05-29"

[[kv_namespaces]]
binding = "VARIANT_DATA"
id = "6a856fe3c08f47bbb1ccd3275979d7bb"

[vars]
DEFAULT_HANDLING_DAYS = "1"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Secrets (set via `wrangler secret put`):
# - FEDEX_CLIENT_ID
# - FEDEX_CLIENT_SECRET
# - FEDEX_ACCOUNT_NUMBER
# - SHOPIFY_WEBHOOK_SECRET (for verifying webhook HMAC signatures)
